name: Build Fable Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "style.css"
      - "game.js"
      - "pc/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: pc
        run: npm install
      - name: Build installer
        working-directory: pc
        run: npm run build
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Fable-1.0-Windows
          path: pc/dist/Fable-1.0.exe
          if-no-files-found: error
